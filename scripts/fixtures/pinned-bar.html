<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AccessNotice rebuild fixture</title>
<style>
  :root { --header-h: 56px; --access-bar-h: 0px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:#e8ecf4; min-height: 100dvh; }
  .nav {
    position: sticky; top:0; z-index:50; height: var(--header-h);
    background: rgba(10,26,63,0.94); color:#fff; display:flex; align-items:center; padding:0 16px; font-weight:700;
  }
  .bar {
    position: sticky; top: var(--header-h); z-index:40; width:100%; overflow: visible;
    color:#fff; box-shadow: 0 8px 32px rgba(185,28,28,0.28), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .bar.blocked { background: linear-gradient(135deg, #7F1D1D 0%, #B91C1C 55%, #991B1B 100%); }
  .bar.expiring { background: linear-gradient(135deg, #B45309 0%, #D97706 55%, #F59E0B 100%); box-shadow: 0 8px 32px rgba(217,119,6,0.28), inset 0 1px 0 rgba(255,255,255,0.12); }
  .inner { max-width:1120px; margin:0 auto; padding:12px 16px; }
  .inner.compact { padding-top:8px; padding-bottom:8px; }
  .status { font-size:15px; font-weight:600; line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
  .hero { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; white-space:normal; overflow-wrap:anywhere; }
  .course { font-size:13px; opacity:0.7; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .glyph { width:32px; height:32px; border-radius:999px; background:rgba(255,255,255,.15); display:grid; place-items:center; flex-shrink:0; margin-top:2px; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; min-height:48px; min-width:44px; border-radius:12px; font-weight:600; font-size:14px; border:0; }
  .btn.primary { background:#fff; color:#B91C1C; }
  .bar.expiring .btn.primary { color:#B45309; }
  .btn.secondary { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.24); }
  .progress { height:2px; background:rgba(0,0,0,.2); }
  .progress > i { display:block; height:100%; width:20%; background:#FBBF24; transform-origin:left; }
  .content { padding:20px 16px; }
  @media (min-width:480px) {
    .wrap { display:flex; align-items:center; gap:16px; }
    .wrap .text { flex:1; }
    .wrap .actions { margin-top:0; flex-shrink:0; width:auto; min-width:280px; }
  }
  @media (min-width:1024px) {
    .course { -webkit-line-clamp:unset; overflow:visible; display:block; }
  }
</style>
</head>
<body>
  <div class="nav" id="nav">Naman IAS</div>
  <div class="bar blocked" id="bar" data-testid="bar">
    <div class="inner" id="inner">
      <div class="wrap">
        <div class="text">
          <div class="row">
            <div class="glyph">🔒</div>
            <div>
              <div class="status" id="status">Access paused</div>
              <div class="hero" id="hero">₹20,000 · Instalment 1</div>
              <div class="course" id="course">Safalta Online Foundation 2027/28/29</div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" type="button">Pay now</button>
          <button class="btn secondary" type="button" id="paid">Already paid</button>
        </div>
      </div>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </div>
  <div class="content" id="content">Page content below — sticky bar, intrinsic height, no overlay.</div>
  <script>
    const params = new URLSearchParams(location.search);
    const state = params.get('state') || 'blocked';
    const compact = params.get('compact') === '1';
    const long = params.get('long') !== '0';
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const hero = document.getElementById('hero');
    const course = document.getElementById('course');
    if (state === 'expiring') {
      bar.className = 'bar expiring';
      status.textContent = 'Access active for 5 more days';
      hero.textContent = '₹20,000 · Instalment 1';
      document.querySelector('.glyph').textContent = '🕐';
    }
    if (!long) course.textContent = 'GS Batch';
    if (compact) {
      document.getElementById('inner').classList.add('compact');
      course.style.display = 'none';
    }
    const sync = () => {
      document.documentElement.style.setProperty('--access-bar-h', bar.offsetHeight + 'px');
      document.documentElement.style.setProperty('--header-h', document.getElementById('nav').offsetHeight + 'px');
    };
    sync(); new ResizeObserver(sync).observe(bar);
    window.__metrics = () => {
      const h = getComputedStyle(hero);
      const contentTop = document.getElementById('content').getBoundingClientRect().top;
      const barBottom = bar.getBoundingClientRect().bottom;
      return {
        textOverflow: h.textOverflow,
        whiteSpace: h.whiteSpace,
        heroOverflow: hero.scrollWidth > hero.clientWidth + 2,
        paidLabel: document.getElementById('paid').textContent,
        gap: contentTop - barBottom,
        accessBarH: getComputedStyle(document.documentElement).getPropertyValue('--access-bar-h').trim(),
        headerH: getComputedStyle(document.documentElement).getPropertyValue('--header-h').trim(),
        barTop: bar.getBoundingClientRect().top,
        navBottom: document.getElementById('nav').getBoundingClientRect().bottom,
      };
    };
  </script>
</body>
</html>
